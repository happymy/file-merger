<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>File Merger Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- 顶部：标题和语言切换 -->
    <div class="header">
      <h1 data-i18n="title">📁 File Merger Pro</h1>
      <div class="lang-switch">
        <button id="langEnBtn" class="lang-btn">EN</button>
        <button id="langZhBtn" class="lang-btn">中文</button>
      </div>
    </div>

    <!-- 目录选择区（支持拖拽） -->
    <div class="drop-zone" id="dropZone">
      <div class="control-row">
        <button id="selectDirBtn" data-i18n="selectDir">📂 Select Directory</button>
        <span id="dirPathDisplay" class="path-display" data-i18n-placeholder="noDirSelected"></span>
        <button id="historyBtn" title="Recent directories">📋</button>
      </div>
      <div id="historyDropdown" class="history-dropdown hidden"></div>
    </div>

    <!-- 配置区 -->
    <div class="config-section">
      <!-- 排除目录 -->
      <div class="exclude-group">
        <label data-i18n="excludeDirsLabel">Exclude Directories</label>
        <span class="hint" data-i18n="excludeDirsHint"></span>
        <div class="tag-container" id="excludeDirsContainer"></div>
        <div class="add-exclude-row">
          <input type="text" id="newExcludeDir" data-i18n-placeholder="dirPlaceholder">
          <button id="addExcludeDirBtn" data-i18n="addBtn">Add</button>
          <button id="pickExcludeDirBtn" title="Browse" data-i18n="browseDirBtn">📁 Browse</button>
        </div>
      </div>

      <div class="exclude-group">
        <label data-i18n="excludeFilesLabel">Exclude Files</label>
        <span class="hint" data-i18n="excludeFilesHint"></span>
        <div class="tag-container" id="excludeFilesContainer"></div>
        <div class="add-exclude-row">
          <input type="text" id="newExcludeFile" data-i18n-placeholder="filePlaceholder">
          <button id="addExcludeFileBtn" data-i18n="addBtn">Add</button>
          <button id="pickExcludeFileBtn" title="Browse" data-i18n="browseFileBtn">📄 Browse</button>
        </div>
      </div>

      <div class="input-row">
        <div class="input-group">
          <label data-i18n="whiteListLabel">Whitelist extensions</label>
          <span class="hint" data-i18n="whiteListHint"></span>
          <input type="text" id="whiteListExts" data-i18n-placeholder="whiteListPlaceholder">
        </div>
        <div class="input-group">
          <label data-i18n="maxSizeLabel">Max file size</label>
          <span class="hint" data-i18n="maxSizeHint"></span>
          <input type="number" id="maxFileSizeKB" min="0" value="0">
        </div>
      </div>
      <div class="checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" id="excludeBinary"> <span data-i18n="excludeBinary">Exclude binary files</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="ignoreHidden"> <span data-i18n="ignoreHidden">Ignore hidden files/folders</span>
        </label>
      </div>
      <div class="checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" id="compressOutput"> <span data-i18n="compressOutput">Compress output</span>
        </label>
      </div>
      <div class="input-row">
        <div class="input-group">
          <label data-i18n="maxCharsLabel">Max chars per part</label>
          <input type="number" id="maxCharsPerPart" min="0" value="0">
        </div>
      </div>
      <div class="input-group">
        <label data-i18n="splitPartFooterLabel">Per-part footer</label>
        <textarea id="splitPartFooter" rows="2" data-i18n-placeholder="splitPartFooterPlaceholder"></textarea>
      </div>
      <div class="input-group">
        <label data-i18n="customFooterLabel">Custom footer (end of file)</label>
        <span class="hint" data-i18n="customFooterHint"></span>
        <textarea id="customFooter" rows="3" data-i18n-placeholder="footerPlaceholder"></textarea>
      </div>
      <div class="input-group">
        <label data-i18n="outputNameLabel">Output filename template</label>
        <span class="hint" data-i18n="outputNameHint"></span>
        <input type="text" id="outputFileName" value="merged-{timestamp}.md">
      </div>
    </div>

    <!-- 操作按钮 -->
    <div class="actions">
      <button id="previewBtn" data-i18n="previewBtn">🔍 Scan & Preview</button>
      <button id="saveBtn" disabled data-i18n="saveBtn">💾 Merge & Save</button>
    </div>

    <!-- 进度条 -->
    <div id="progressContainer" class="progress-container hidden">
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <span id="progressText">0%</span>
    </div>

    <!-- 预览区 -->
    <div class="preview-container">
      <div class="preview-header">
        <h3 data-i18n="previewTitle">Preview</h3>
        <div id="previewTabs" class="tabs"></div>
        <button id="copyCurrentPartBtn" class="copy-btn" data-i18n="copyBtn">📋 Copy</button>
      </div>
      <pre id="previewArea"></pre>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
