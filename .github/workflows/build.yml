name: Build and Release

on:
  workflow_dispatch:
    # 可选：添加说明，让用户知道应该从 tag 触发
    inputs:
      tag:
        description: 'Tag to build (leave empty to use current ref)'
        required: false
        type: string

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3. 安装依赖
      - name: Install dependencies
        run: npm ci

      # 4. 用 Electron Forge 打包（make 命令会生成 .exe）
      - name: Make with Electron Forge
        run: npx electron-forge make

      # 5. 从 tag 名称提取版本号（例如 v2.4.1 → 2.4.1）
      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT

      # 6. 创建 GitHub Release 并上传产物
      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.version }}"
          tag_name: ${{ github.ref }}
          files: out/make/**/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}