name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. 检出代码（默认 checkout 即可，推送的是 tag，github.ref 为 refs/tags/v...）
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 Node.js 18（与项目兼容的 LTS 版本）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3. 安装依赖
      - name: Install dependencies
        run: npm ci

      # 4. Electron Forge 打包（根据 forge.config.js 生成 .exe 等）
      - name: Make with Electron Forge
        run: npx electron-forge make

      # 5. 从 tag 名称提取纯净版本号（去掉前缀 v）
      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT

      # 6. 创建 GitHub Release 并上传可执行文件
      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          tag_name: "${{ github.ref_name }}"
          files: out/make/**/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}